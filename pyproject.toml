[project]
name = "aha"
version = "0.1.0"
description = "AHA: self-supervised weight-space programming. A rank-one weight edit, built from the model's own samples, that stops small reasoning models looping"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.6",
  "transformers>=5.17",
  "safetensors",
  "numpy",
  "huggingface_hub",
  "tqdm",
  "datasets>=5.1.0",
  "math-verify",
  "vllm>=0.33; sys_platform == 'linux'",   # generation; Linux + CUDA only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afwsp"]
